# Contrastive "hard negatives" for ml/train_crisis.py: everyday sentences that share words
# or shapes with crisis phrases ("I want to ...", "dying to", "rope", "pills") but are not a
# risk. Written for training after the first model flagged everyday messages; the phrasings
# deliberately differ from tests/data/safety/benign.yaml, which is evaluation data. Each
# `frames` entry is combined with every `wants` entry.
frames:
  - "I want to {}"
  - "I really want to {}"
  - "I just want to {}"
  - "i wanna {}"
  - "I don't want to {} anymore"
  - "I feel like I need to {}"
  - "honestly I want to {}"
  - "I keep wanting to {}"
wants:
  - "talk about my day"
  - "go home early"
  - "sleep in tomorrow"
  - "learn to drive"
  - "eat something warm"
  - "change careers"
  - "move to a new city"
  - "be a better friend"
  - "finish this essay"
  - "take a break from studying"
  - "stay in bed this morning"
  - "visit my grandparents"
  - "delete social media"
  - "get fit this year"
  - "travel somewhere quiet"
  - "leave this party"
  - "get some fresh air"
  - "feel more confident at work"
  - "stop procrastinating"
  - "be left alone for a bit"
  - "end this phone call"
  - "end the meeting early"
  - "break up with him"
  - "move out of this flat"
  - "stop feeling so anxious"
  - "understand why I am sad"
  - "rest for a while"
  - "kill some time at the mall"
  - "kill the lights and watch a film"
  - "cry and let it out"
sentences:
  - "I'm dying to see that new film"
  - "I nearly died laughing at the meme"
  - "my laptop battery is dead again"
  - "the plants on my balcony are dying"
  - "I'm dying of boredom in this lecture"
  - "this assignment is killing my weekend"
  - "I could kill for a cold drink"
  - "kill the process and restart the server"
  - "the band absolutely killed it last night"
  - "I'm dead serious about learning guitar"
  - "dead tired after the night shift"
  - "I bought some rope to tie the tent down"
  - "the kitchen knife needs sharpening"
  - "I take vitamin pills every morning"
  - "remember to take your allergy pills"
  - "the bridge is closed for repairs"
  - "we walked across the bridge at sunset"
  - "I cut my finger chopping onions"
  - "I burned my hand on the oven"
  - "I hurt my back lifting boxes"
  - "I'm so burned out from exams"
  - "nobody replied to my message today"
  - "I feel like nobody gets my jokes"
  - "I feel invisible in group chats"
  - "I don't want to go to school tomorrow"
  - "I don't want to see him ever again"
  - "I'm tired of this rainy weather"
  - "I'm tired of cooking every night"
  - "I give up on this puzzle"
  - "what's the point of this meeting"
  - "there's no point arguing with her"
  - "I can't do this maths homework"
  - "I'm done with this game"
  - "I'm over it, honestly"
  - "life is so busy right now"
  - "I want this week to end"
  - "I wish this day was over"
  - "this traffic is the worst"
  - "I'm drowning in emails"
  - "my phone fell off the balcony"
