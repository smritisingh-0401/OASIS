# GAD-7: standard published items, options and severity bands (rules CL1). Do not edit the
# wording: it must match the published form word for word. The published GAD-7 form has no
# functional-difficulty question, so none is asked.
schema: oasis.content/v1
kind: assessment_instrument
instrument: GAD7
name: GAD-7
version: "2026.10.0"
review_status: standard_published_instrument
citation: >-
  Spitzer RL, Kroenke K, Williams JBW, Löwe B. A brief measure for assessing generalized
  anxiety disorder: the GAD-7. Arch Intern Med. 2006;166(10):1092-1097. Developed by Drs.
  Robert L. Spitzer, Janet B.W. Williams, Kurt Kroenke and colleagues, with an educational
  grant from Pfizer Inc. No permission required to reproduce, translate, display or distribute.
source: https://www.phqscreeners.com/images/sites/g/files/g10060481/f/201412/GAD-7_English.pdf
bands_source: https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf
verified_on: 2026-10-08
stem: "Over the last 2 weeks, how often have you been bothered by the following problems?"
options: ["Not at all", "Several days", "More than half the days", "Nearly every day"]
items:
  - "Feeling nervous, anxious or on edge"
  - "Not being able to stop or control worrying"
  - "Worrying too much about different things"
  - "Trouble relaxing"
  - "Being so restless that it is hard to sit still"
  - "Becoming easily annoyed or irritable"
  - "Feeling afraid as if something awful might happen"
functional: null
bands:
  - {min: 0, max: 4, label: minimal}
  - {min: 5, max: 9, label: mild}
  - {min: 10, max: 14, label: moderate}
  - {min: 15, max: 21, label: severe}
