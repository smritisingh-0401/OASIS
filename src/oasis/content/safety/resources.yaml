# Crisis and emergency contacts shown by the handoff and the static help card.
# Clinician review pending: CR-04. GENERATED from verified sources; edit with care.
#
# Tier 1 (has `lines`): a crisis line confirmed on the service's own website or a
# government website, with the URL and date stored on the entry.
# Tier 2 (no `lines`): emergency number only, from UK Government (FCDO) travel advice,
# a single consistent official source for every country. Countries with no usable number
# carry an `emergency_note` instead. No unverified number is ever shipped (design §2.4).
