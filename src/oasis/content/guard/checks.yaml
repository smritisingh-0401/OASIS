# Hypercompliance checks (design §8.2, FR-GRD-2). Each list belongs to the guard rule of the
# same name. Patterns are matched against the safety normaliser's base form (lowercase,
# apostrophes removed: "you're" is "youre").
#   agreement     an agreement marker; with an echo of the user's distorted claim in the same
#                 sentence it fails no_agreeing (G-AGREE). A clause that restates the claim
#                 with no hedge, reflection or negation fails it too.
#   strong_agreement  "you're right", "I agree with you": on a thinking-trap or medication
#                 message they fail no_agreeing even without an echo of the claim (the model,
#                 told to agree, wrote "I agree with you that it feels like this is your
#                 responsibility" to "It's all my fault", stress check 2026-10-13)
#   medication_topic  a user message about medication, which carries no_agreeing
#   hedges        words that make a restated claim a reflection or a question, not agreement
#   presupposing  a "since / because / given that" opener; with an advice word and an echo of
#                 the claim it fails no_presupposing (G-PRESUP)
#   advice_words  what makes a presupposing sentence advice
#   self_label    calls the user a harsh global name (G-LABEL); every generated reply
#   diagnosis     names a condition the user has (G-DX); every generated reply
#   medication    drug names, doses, starting or stopping medicine (G-MED); every reply
#   made_up_step  an exercise step in the model's own words ("R is for Reconnect"); only the
#                 vetted script gives steps (no_exercise_step); every generated reply
#   step_text     an instruction the model wrote itself; an exercise-step reply is one
#                 acknowledging sentence, and the real step follows it (ack_only)
#   refusals      the reply declining to diagnose or advise, as "can't tell / say / know if or
#                 whether": a diagnosis or medication phrase in the same clause is allowed ("I
#                 can't tell you if you have depression"); "I can't say for sure you have
#                 depression" is not a refusal
#   label_nouns   words for a person; after an adjective VADER scores <= -0.3 ("a horrible
#                 person", "a terrible mother") they make a harsh global label (G-LABEL)
#   harsh_words   label words that are harsh on their own ("a failure", "a monster")
# Engineering start values (CR-16).
schema: oasis.content/v1
kind: guard_checks
version: "2026.10.0"
review_status: needs_clinician_review
patterns:
  agreement:
    - '\b(?:youre|you are) (?:absolutely |completely |totally |probably |quite |so )?right\b'
    - '\b(?:thats|that is|its|it is) (?:so |very |completely |totally )?(?:true|right|fair|correct)\b'
    - '\bi (?:totally |completely |fully )?agree\b'
    - '\bexactly\b'
    - '^(?:yes|yeah|yep|true)\b'
    - '\bit makes sense that (?:you are|youre)\b'
  hedges:
    - '\b(?:sounds?|feels?|feeling|felt|seems?|wonder\w*|think\w*|believe\w*|thought)\b'
    - '\b(?:might|may|could|can|maybe|perhaps|if|whether|sometimes)\b'
    - '\b(?:not|isnt|arent|doesnt|dont|didnt|wasnt|werent|wont|hardly)\b'
  presupposing:
    - '^(?:since|because|as|given that|seeing as|now that)\b'
  advice_words:
    - '\b(?:try|trying|could|should|maybe|might|consider|need to|have to|why not|focus|look for)\b'
  self_label:
    - '(?<!mean )(?<!make )\b(?:youre|you are)(?! not)(?: (?:such|so|really|just|a|an|total|totally|complete|completely|absolute|absolutely|utter|utterly|a bit of))* (?:failure|loser|idiot|stupid|worthless|useless|pathetic|burden|disappointment|mess|fraud|joke|hopeless|unlovable|broken)\b'
    - '\b(?:as|being|to be) (?:a |an |such a |so )?(?:failure|loser|idiot|stupid|worthless|useless|pathetic|burden|disappointment|fraud)\b'
  diagnosis:
    - '\b(?:you|youve) (?:probably |might |may |could |clearly |definitely |obviously )?(?:have|has|got) (?:a |an |some )?(?:clinical |major |generali[sz]ed |social |severe |mild )?(?:depression|bipolar|ocd|adhd|add|ptsd|bpd|borderline|schizophrenia|psychosis|insomnia|\w+ disorder)\b'
    - '\b(?:youre|you are|you might be|you may be|you could be|you must be) (?:probably |clearly |definitely )?(?:clinically depressed|depressed|bipolar|manic|psychotic|schizophrenic|autistic|suffering from)\b'
    - '\b(?:sounds|looks|seems) like (?:you have |a |an )?(?:clinical )?(?:depression|bipolar|ocd|adhd|ptsd|bpd|\w+ disorder)\b'
    - '\b(?:a |the )?(?:symptoms?|signs?) of (?:clinical )?(?:depression|bipolar|ocd|adhd|ptsd|\w+ disorder)\b'
  medication:
    - '\b(?:sertraline|fluoxetine|prozac|zoloft|citalopram|escitalopram|lexapro|paroxetine|venlafaxine|duloxetine|mirtazapine|bupropion|wellbutrin|amitriptyline|lithium|lamotrigine|quetiapine|seroquel|olanzapine|aripiprazole|risperidone|diazepam|valium|lorazepam|ativan|alprazolam|xanax|clonazepam|propranolol|zopiclone|zolpidem|ambien|melatonin|methylphenidate|ritalin|adderall|pregabalin|gabapentin|hydroxyzine|buspirone)\b'
    - '\b\d+ ?(?:mg|milligrams?|mcg|micrograms?)\b'
    - '\b(?:stop(?:s|ped|ping)?|start(?:s|ed|ing)?|quit(?:s|ting)?|skip(?:s|ped|ping)?|(?:come|comes|coming|came|get|gets|getting|got|go|going) off|wean(?:s|ed|ing)? (?:yourself )?off|taper(?:s|ed|ing)?(?: off)?|cut(?:s|ting)? (?:down|back) on|increas(?:e|es|ed|ing)|reduc(?:e|es|ed|ing)|doubl(?:e|es|ed|ing)|halv(?:e|es|ed|ing)) (?:taking (?:them|it)|a dose|(?:taking )?your (?:meds|medication|medications|medicine|pills|tablets|dose|antidepressants?))\b'
    - '\b(?:take|taking|try|trying|start|starting|ask for|get) (?:taking )?(?:an? |some )?(?:antidepressants?|ssris?|snris?|sleeping (?:pills?|tablets?)|benzos?|benzodiazepines?|sedatives?|tranquill?i[sz]ers?|beta.blockers?|antipsychotics?)\b'
  refusals:
    - '\b(?:cannot|cant|can not|unable to|not able to|wont|will not|not going to)\b[^.!?,;:]*?\b(?:tell|say|know|decide)(?: you)?(?: for (?:sure|certain))? (?:if|whether)\b'
    - '\bnot (?:something|for me|my place) (?:i can |to )(?:say|tell|decide|diagnose|judge)\b'
  made_up_step:
    - '\b[a-z] is for\b'
  step_text:
    - '^(?:(?:okay|ok|alright|now|so|just|lets|let us|gently|slowly),? )*(?:take|breathe|notice|try|close|focus|feel|imagine|pause|stop|sit|put|place|look|name|keep|count|relax|let|hold|rest|step)\b'
  label_nouns:
    - '^(?:person|human|friend|partner|parent|mother|mom|mum|father|dad|son|daughter|sister|brother|sibling|student|employee|worker|wife|husband|girlfriend|boyfriend|colleague|boss|kid|child|man|woman|guy|girl)$'
  harsh_words:
    - '\b(?:failure|loser|monster|burden|disappointment|idiot|fraud|joke|waste|nobody|mess|worst|toxic|pathetic|worthless|useless|hopeless|unlovable|disgrace)\b'
  strong_agreement:
    - '\b(?:youre|you are) (?:absolutely |completely |totally |so |quite |probably )?right\b'
    - '\bi (?:totally |completely |fully |really )?agree with you\b'
  medication_topic:
    - '\b(?:meds|medication|medications|medicine|pills|tablets|antidepressants?|ssris?|snris?|dose|dosage|prescription|prescribed)\b'
  # A company named as the maker, or another assistant's name (demo testing, 2026-10-29:
  # "I am an artificial intelligence created by Google"). OASIS runs an open model and is
  # made by no company. Mentioning a company otherwise ("your friend works at Google") is fine.
  maker_claim:
    - '\b(?:created|made|built|developed|trained|designed|owned|programmed|run|powered) by (?:google|openai|open ai|meta|facebook|alibaba|qwen|microsoft|anthropic|deepmind|apple|amazon|a company|a tech company)\b'
    - '\b(?:im|i am|as|this is) (?:an? )?(?:gemini|chatgpt|chat gpt|gpt\S*|qwen\S*|bard|claude|llama|copilot|siri|alexa)\b'
  # Dismissive positivity (demo testing, 2026-10-29): telling someone who is low to stay
  # positive reads as "your feelings are wrong". Encouragement is hope that leaves the
  # feeling alone ("small steps still count"). Checked on every generated reply (CR-14).
  toxic_positivity:
    - '\b(?:stay|be|think|keep|remain|try to be|just be) (?:more )?positive\b'
    - '\bpositive (?:attitude|mindset|thinking|vibes)\b'
    - '\b(?:look|focus) on the (?:bright|positive|sunny) side\b'
    - '\b(?:it|things|this|that) could (?:always )?be (?:a lot |much |so much )?worse\b'
    - '\beverything happens for a reason\b'
    - '\b(?:others|other people|some people|many people) have it (?:much |a lot |so much )?worse\b'
    - '\b(?:just )?cheer up\b'
    - '\bgood vibes\b'
    - '\bat least you (?:have|got|still)\b'
