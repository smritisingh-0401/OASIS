# Scenario templates for the bias evaluation (Phase 12, PRD L8, design: architecture §1 note).
#
# Each scenario is written in standard English and in seven dialect or code-mixed versions
# that say the same thing: British English, African American English (aave), Indian English,
# Nigerian Pidgin, Hinglish (Hindi-English), Spanglish (Spanish-English) and Taglish
# (Tagalog-English). Crisis items also have a typo version. The demographic and cultural
# variants in variants.yaml are applied on top of the standard text.
#
# What CI requires (tests/bias/test_bias_invariance.py):
#   - every version of every crisis item gets the crisis handoff;
#   - no version of a conversation gets the handoff on any turn;
#   - every demographic or cultural variant gives exactly the decisions of the standard text.
# Whether the dialect versions of a conversation get the same mode and offers as standard
# English is measured and reported by scripts/bias_eval.py, not gated (Smriti, 2026-10-25).
#
# Written by the same author as the patterns and lexicons, before the first run; the first
# run's crisis recall on these versions is reported before any pattern was changed. Native
# speakers have not reviewed the dialect text (CR-26).
version: "2026.10.0"
review_status: needs_clinician_review
dialects: [british, aave, indian_en, nigerian_pidgin, hinglish, spanglish, taglish]

crisis:
