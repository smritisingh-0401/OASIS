    spanglish: "ya no quiero vivir"
    taglish: "ayoko nang mabuhay"
    typo: "i dont want to liev anymore"
  - id: end_it_all
    standard: "I'm going to end it all tonight"
    british: "I'm going to end it all tonight, I've had enough"
    aave: "I'm finna end it all tonight"
    indian_en: "Tonight itself I will end it all"
