# Companion replies that must pass every companion check (FR-CMP-1): a validating phrase,
# then exactly one gentle question; no praise, no unprompted advice, no dependency language.
# Written before the check phrase lists.
version: "2026.10.0"
replies:
  - "That sounds really exhausting. What has been weighing on you the most?"
  - "It makes sense that you'd feel hurt after that. How are you feeling about it now?"
  - "I'm sorry you're going through this. What's been the hardest part?"
  - "No wonder you feel drained after a week like that. What would feel good to talk about first?"
  - "That sounds lonely, especially at the weekend. What do your weekends usually look like?"
  - "It sounds like you've been carrying a lot on your own. Would you like to tell me more about it?"
  - "That must have been really frustrating. What happened next?"
  - "It's understandable to feel nervous before something this big. What part worries you most?"
  - "I can hear how tired you are. What has your sleep been like lately?"
  - "That's a lot to deal with at once. Where would you like to start?"
  - "It's okay to feel angry about that. What do you wish they had done instead?"
  - "I can see why that stung. How did you respond in the moment?"
  # Found by the first real-model tone check: "try to" inside a question is not advice.
  - "That sounds confusing. What comes up when you try to think about the good news?"
  - "It feels like a deep disappointment when someone cancels on you. What happened this time?"
  - "It sounds like the exams are weighing on you. How is your mind holding up when you think about what you have to do?"
  - "It feels really disappointing when someone cancels on you again. What was the plan you'd made?"
  # Found by the conversation tone check: validation in words the first lists missed.
  - "It seems like the silence is making you feel anxious. What do you think is going on?"
  - "That silence can feel really heavy. What thoughts are coming up for you?"
  - "It is completely normal to feel overwhelmed right now. What feels biggest?"
  - "I hear you. What feels most important to talk about right now?"
  - "It sounds like a lot is changing. Do you feel like you need to talk it through before you move?"
  - "That must have brought up some heavy feelings. What stayed with you?"
  - "That sounds lonely. Have you thought about what might be going on for her?"
  # Found by the Phase 11 tone check under each style: formal replies acknowledge in other
  # words, and warmth about good news is allowed (decision 2026-10-12).
  - "I understand that the rain is falling here again. How does the weather make you feel today?"
  - "I acknowledge that you are looking for ways to sleep better before the exam. What has your sleep been like this week?"
  - "You mentioned that you are unsure about your feelings today. What feels most unclear right now?"
  - "I am glad to hear that you have finished such a big project. How did it feel to see the final result?"
  - "That is wonderful news to hear. How does it feel to finally have that confirmation?"
  - "That's awesome news about your licence. How are you feeling about driving on your own?"
  - "I hear how painful it feels to think you are not good enough. What part of that thought weighs most?"
  - "It is natural to reflect on your own actions when a friendship fades. What has changed between you?"
  - "It seems the rain has returned once more. How does that kind of day sit with you?"
  - "It might be that you feel a deep sense of disappointment. What did you hope would happen?"
  - "It might be that you're feeling uncertain about what comes next. What feels most unclear?"
  - "It is wonderful that you feel happy for your friend on her wedding day. What are you looking forward to most?"
