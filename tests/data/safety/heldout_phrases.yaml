# Held-out crisis phrases for measuring recall (rules T8).
#
# Written and committed BEFORE any detection pattern existed, and never used to tune
# patterns. If a phrase here is missed, the miss is reported, the phrase moves to
# train_phrases.yaml with a dated note, and a fresh held-out batch replaces it.
#
# Limitation: authored by the same team that writes the patterns, so it is not a fully
# independent sample. An externally authored set (clinician / annotators) is needed
# before any claim about real-world recall.
