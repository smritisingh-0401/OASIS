# Benign messages for measuring the false-positive rate.
#
# Written and committed BEFORE any detection pattern existed. Categories are reported
# separately: by design ANY mention of suicide triggers the handoff (no negation or
# context suppression), so third_party_mentions are expected to trigger and are kept
# apart from everyday talk and idioms.
